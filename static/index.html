<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prompt Template</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#202124;background:#f6f7f9}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:9px 13px;background:#202124;color:white}.secondary{background:#e7e9ee;color:#202124}.danger{background:#c93636}.layout{display:grid;grid-template-columns:320px minmax(0,1fr);height:100vh;overflow:hidden}.sidebar{background:#fff;border-right:1px solid #e1e3e8;padding:22px;overflow:hidden;height:100vh;min-height:0;display:flex;flex-direction:column}.main{padding:28px;max-width:1100px;width:100%;margin:0 auto;height:100vh;overflow-y:auto;min-height:0;align-self:start}.brand{font-size:22px;font-weight:700;margin-bottom:20px}.row{display:flex;gap:8px;align-items:center}.stack{display:grid;gap:12px}.field{width:100%;border:1px solid #d7dbe3;border-radius:8px;padding:10px;background:#fff}.prompt-list{display:grid;gap:8px;margin-top:18px;overflow-y:auto;flex:1;min-height:0;padding-right:4px}.prompt-item{padding:12px;border:1px solid #e4e7ed;border-radius:10px;background:#fff;cursor:pointer}.prompt-item.active{border-color:#536dfe;box-shadow:0 0 0 2px #e7eaff}.muted{color:#6f7580;font-size:13px}.tags{display:flex;flex-wrap:wrap;gap:6px}.tag{font-size:12px;background:#eef0f5;padding:4px 8px;border-radius:999px}.section{background:#fff;border:1px solid #e2e5ea;border-radius:12px;padding:20px;margin-bottom:16px}.section h2{font-size:16px;margin:0 0 14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.example{border-top:1px solid #e5e7eb;padding-top:14px;margin-top:14px}.example summary{cursor:pointer;font-weight:600;padding:8px 0}.example[open] summary{margin-bottom:12px}.attachment{display:flex;justify-content:space-between;align-items:center;background:#f4f5f7;border-radius:8px;padding:8px;margin-top:6px}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:20px}.modal>div{background:#fff;padding:22px;border-radius:12px;width:min(600px,100%)}#modal:empty{display:none}#modal:not(:empty){position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:20px;z-index:20}.modal-card{background:#fff;padding:22px;border-radius:12px;width:min(600px,100%);max-height:90vh;overflow-y:auto}
</style></head>
<body><div class="layout"><aside id="sidebar" class="sidebar"><div class="brand">Prompt Template</div><div class="stack"><input id="search" class="field" placeholder="搜索标题、正文、场景、tag"><select id="category" class="field"><option value="">全部分类</option><option value="pose">Pose</option><option value="action">Action</option></select><input id="tag" class="field" placeholder="按 tag 筛选"><button id="newBtn">新建条目</button><button id="providerBtn" class="secondary">Provider 设置</button></div><div id="list" class="prompt-list"></div></aside><main class="main"><div id="editor"></div></main></div><div id="modal"></div>
<script src="/static/generation.js"></script>
<script src="/static/providers.js"></script>
<style>[hidden]{display:none!important}.generation-preview{max-width:220px;max-height:220px;object-fit:contain;margin:8px;transition:transform .15s}.generation-preview:hover{transform:scale(1.4);position:relative;z-index:5}</style>
<script>
const $=id=>document.getElementById(id), state={items:[],current:null,providers:[],offset:0,loading:false,hasMore:true};
async function api(url,opt={}){const r=await fetch(url,opt);const d=await r.json();if(!r.ok)throw Error(d.detail||'请求失败');return d}
function esc(s=''){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function load(reset=true){if(state.loading)return;const query={q:$('search').value,category:$('category').value,tag:$('tag').value,offset:reset?0:state.offset,limit:30};if(reset){state.items=[];state.offset=0;state.hasMore=true;$('list').innerHTML=''}state.loading=true;const batch=await api('/api/prompts?'+new URLSearchParams(query));state.items=reset?batch:[...state.items,...batch];state.offset+=batch.length;state.hasMore=batch.length===30;state.loading=false;renderList();if(state.current&&reset){const found=state.items.find(x=>x.id===state.current.id);if(found) await open(found.id)}}
function renderList(){$('list').innerHTML=state.items.map(x=>`<div class="prompt-item ${state.current?.id===x.id?'active':''}" data-id="${x.id}"><b>${esc(x.title)}</b><div class="muted">${esc(x.category)} · ${esc(x.tags.join(', '))}</div></div>`).join('')||'<div class="muted">暂无条目</div>';document.querySelectorAll('.prompt-item').forEach(x=>x.onclick=()=>open(x.dataset.id))}
async function open(id){state.current=await api('/api/prompts/'+id);renderEditor();renderList()}
function renderReferences(text,files,lang){if(!files.length)return esc(text||'');const pattern=lang==='zh'?/(图\s*\d+)/g:lang==='en'?/(image\s*\d+)/gi:/(画像\s*\d+)/g;return esc(text||'未生成建议，未引用图片。').replace(pattern,(token)=>{const match=token.match(/\d+/);const index=match?Number(match[0])-1:-1;const file=files[index];const label=file?`已引用：${esc(file.name)}`:'未找到对应图片引用';return `<span class="image-reference" title="${label}">${token}</span>`})}
function renderAiResult(result,files){$('aiResult').innerHTML=`<div><b>中文建议</b><p>${renderReferences(result.content_zh,files,'zh')}</p></div><div><b>English suggestion</b><p>${renderReferences(result.content_en,files,'en')}</p></div><div><b>日本語の提案</b><p>${renderReferences(result.content_ja,files,'ja')}</p></div>`}
function editorData(){return {title:$('title').value,category:$('editorCategory').value,content_zh:$('contentZh').value,content_en:$('contentEn').value,content_ja:$('contentJa').value,language_sync:$('languageSync').value,scenarios:$('scenarios').value,notes:$('notes').value,tags:$('tags').value.split(',').map(x=>x.trim()).filter(Boolean)}}
function renderEditor(){$('generationPanel')?.dispatchEvent(new Event('generation-dispose'));if(!state.current){$('editor').innerHTML='<div class="section"><h2>选择或新建一个 Prompt</h2><p class="muted">管理 pose 与 action 的 prompt、适用场景、examples 和附件。</p></div>';return}const p=state.current;$('editor').innerHTML=`<div class="section"><div class="row" style="justify-content:space-between"><h2>Prompt 条目</h2><div class="actions"><button id="saveBtn">保存</button><button id="deleteBtn" class="danger">删除</button></div></div><div class="grid2"><label>标题<input id="title" class="field" value="${esc(p.title)}"></label><label>分类<select id="editorCategory" class="field"><option value="pose" ${p.category==='pose'?'selected':''}>Pose</option><option value="action" ${p.category==='action'?'selected':''}>Action</option></select></label></div><label>Tags（逗号分隔）<input id="tags" class="field" value="${esc(p.tags.join(', '))}"></label><div class="grid2"><label>中文 Prompt<textarea id="contentZh" class="field" rows="8">${esc(p.content_zh)}</textarea></label><label>English Prompt<textarea id="contentEn" class="field" rows="8">${esc(p.content_en)}</textarea></label></div><label>日本語 Prompt<textarea id="contentJa" class="field" rows="8">${esc(p.content_ja)}</textarea></label><label>三种语言状态<select id="languageSync" class="field"><option value="sync">已同步</option><option value="manual">手动修改，未确认同步</option><option value="ai_pending">请求 AI 同步中</option></select></label><label>适用场景<textarea id="scenarios" class="field" rows="4">${esc(p.scenarios)}</textarea></label><label>备注<textarea id="notes" class="field" rows="3">${esc(p.notes)}</textarea></label></div><div class="section"><h2>AI 修改建议</h2><div class="stack"><textarea id="aiRequest" class="field ai-request" rows="8" placeholder="详细描述修改要求。可在这里引用图1、图2；英文使用 image1、image2；日文使用画像1、画像2。"></textarea><button id="aiBtn">请求 AI</button></div><pre id="aiResult" style="white-space:pre-wrap"></pre></div><div class="section"><div class="row" style="justify-content:space-between"><h2>Examples</h2><button id="addExample" class="secondary">添加 example</button></div><div id="examples">${p.examples.map(exampleHtml).join('')||'<p class="muted">还没有 example。</p>'}</div></div><div class="section"><h2>附件</h2><form id="uploadForm" class="stack"><input type="file" id="file"><input class="field" id="originalPath" placeholder="原始 URL 或本地路径"><label><input type="checkbox" id="compress"> 请求压缩视频</label><button>上传附件</button></form><div id="attachments">${p.attachments.map(attachmentHtml).join('')||'<p class="muted">还没有附件。</p>'}</div></div>`;bindEditor();bindGeneration()}
function exampleHtml(e){return `<details class="example" data-example="${e.id}"><summary>${esc(e.title||"Example")} · 评分 ${e.rating||0}/5 · ${esc(e.generator_model||"未记录模型")} · ${(e.result_urls||[]).length} 个结果</summary><div class="row"><input class="field ex-title" value="${esc(e.title)}"><button class="secondary ex-save">保存</button><button class="danger ex-delete">删除</button></div><textarea class="field ex-input" rows="3" placeholder="输入或参考条件">${esc(e.input_text)}</textarea><textarea class="field ex-output" rows="4" placeholder="期望 prompt 或输出">${esc(e.output_text)}</textarea><input class="field ex-model" placeholder="生成模型 / ComfyUI workflow" value="${esc(e.generator_model)}"><input class="field ex-rating" type="number" min="0" max="5" placeholder="评分 0-5" value="${e.rating||0}"><input class="field ex-seed" placeholder="Seed" value="${esc(e.seed)}"><textarea class="field ex-params" rows="2" placeholder="生成参数 / ComfyUI workflow 参数">${esc(e.generation_params)}</textarea><textarea class="field ex-notes" rows="2" placeholder="说明">${esc(e.notes)}</textarea>${e.references?.map(ref=>`<div class="muted">Reference: <a href="${esc(ref)}" target="_blank">${esc(ref)}</a></div>`).join('')||''}${e.result_urls?.map(url=>`<div class="attachment"><a href="${esc(url)}" target="_blank">查看结果</a></div>`).join('')||''}${e.attachments.map(attachmentHtml).join('')}</div></details>`}
function attachmentHtml(a){return `<div class="attachment"><span>${esc(a.relative_path)} <small class="muted">${esc(a.compression_status)}</small> <a href="${a.url}" target="_blank">打开副本</a></span><span class="actions"><button class="secondary attachment-open" data-id="${a.id}">打开原文件</button><button class="secondary attachment-path" data-id="${a.id}">更新原始路径</button></span></div>`}
function bindEditor(){ $('saveBtn').onclick=async()=>{state.current=await api('/api/prompts/'+state.current.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(editorData())});await load()};$('deleteBtn').onclick=async()=>{if(confirm('确认删除这个条目及其附件吗？')){await api('/api/prompts/'+state.current.id,{method:'DELETE'});state.current=null;await load();renderEditor()}};$('addExample').onclick=async()=>{await api('/api/prompts/'+state.current.id+'/examples',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:'Example'})});await open(state.current.id)};$('aiBtn').onclick=async()=>{$('aiResult').textContent='请求中…';try{$('aiResult').textContent=(await api('/api/ai/revise',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt_id:state.current.id,request:$('aiRequest').value})})).content}catch(e){$('aiResult').textContent=e.message}};$('uploadForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData();fd.append('file',$('file').files[0]);fd.append('original_path',$('originalPath').value);fd.append('compress',$('compress').checked);fd.append('example_id',$('uploadExample').value);await api('/api/prompts/'+state.current.id+'/attachments',{method:'POST',body:fd});await open(state.current.id)};document.querySelectorAll('.ex-delete').forEach(b=>b.onclick=async()=>{await api('/api/examples/'+b.closest('.example').dataset.example,{method:'DELETE'});await open(state.current.id)});document.querySelectorAll('.ex-save').forEach(b=>b.onclick=async()=>{const box=b.closest('.example');await api('/api/examples/'+box.dataset.example,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:box.querySelector('.ex-title').value,input_text:box.querySelector('.ex-input').value,output_text:box.querySelector('.ex-output').value,notes:box.querySelector('.ex-notes').value,generator_model:box.querySelector('.ex-model').value,rating:Number(box.querySelector('.ex-rating').value||0),seed:box.querySelector('.ex-seed').value,generation_params:box.querySelector('.ex-params').value})});await open(state.current.id)});document.querySelectorAll('.attachment-open').forEach(b=>b.onclick=async()=>{try{await api('/api/attachments/'+b.dataset.id+'/open-original',{method:'POST'})}catch(e){alert(e.message)}});document.querySelectorAll('.attachment-path').forEach(b=>b.onclick=async()=>{const value=prompt('新的原始路径');if(value!==null){const fd=new FormData();fd.append('original_path',value);await api('/api/attachments/'+b.dataset.id,{method:'PATCH',body:fd});await open(state.current.id)}})}
const baseBindEditor=bindEditor;bindEditor=()=>{baseBindEditor();const select=document.createElement('select');select.id='uploadExample';select.className='field';select.innerHTML='<option value="">归属于 Prompt</option>'+state.current.examples.map(e=>`<option value="${e.id}">${esc(e.title)}</option>`).join('');$('uploadForm').insertBefore(select,$('originalPath'))};
const languageSelectFix=bindEditor;bindEditor=()=>{languageSelectFix();$('languageSync').value=state.current.language_sync||'manual'};
const aiImageBind=bindEditor;bindEditor=()=>{aiImageBind();const input=document.createElement('input');input.type='file';input.id='aiImages';input.accept='image/*';input.multiple=true;input.className='field';$('aiRequest').parentElement.insertBefore(input,$('aiRequest'))};
const aiUrlBind=bindEditor;bindEditor=()=>{aiUrlBind();const input=document.createElement('textarea');input.id='aiImageUrls';input.className='field';input.rows=3;input.placeholder='公网图片 URL（一行一个，必须能被 provider 访问）';$('aiRequest').parentElement.insertBefore(input,$('aiRequest'))};
const aiProviderBind=bindEditor;bindEditor=()=>{aiProviderBind();const select=document.createElement('select');select.id='aiProvider';select.className='field';select.innerHTML='<option value="">加载 provider…</option>';$('aiRequest').parentElement.insertBefore(select,$('aiRequest'));api('/api/providers').then(items=>{state.providers=items;const usable=items.filter(p=>p.provider_kind==='text'||p.provider_kind==='multimodal');select.innerHTML=usable.map(p=>`<option value="${p.id}" ${p.is_default?'selected':''}>${esc(p.name)} · ${esc(p.model)} · ${p.provider_kind==='multimodal'?'多模态':'文本'}</option>`).join('')||'<option value="">请先配置 provider</option>';updateAiImageInputs()})};
function updateAiImageInputs(){const provider=state.providers.find(p=>p.id===$('aiProvider')?.value);const mode=provider?.image_input||'both';$('aiImages').style.display=mode==='url'?'none':'';$('aiImageUrls').style.display=mode==='base64'?'none':''}
const aiProviderInputModeBind=bindEditor;bindEditor=()=>{aiProviderInputModeBind();$('aiProvider').onchange=updateAiImageInputs;setTimeout(updateAiImageInputs,0)};
const aiRequestBind=bindEditor;bindEditor=()=>{aiRequestBind();$('aiBtn').onclick=async()=>{const files=[...$('aiImages').files];const images=await Promise.all(files.map(file=>new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)})));const image_urls=$('aiImageUrls').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);$('aiResult').textContent='请求中…';try{const result=await api('/api/ai/revise',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt_id:state.current.id,provider_id:$('aiProvider').value||null,request:$('aiRequest').value,images,image_urls})});renderAiResult(result,files)}catch(e){$('aiResult').textContent=e.message}}};
$('list').addEventListener('scroll',()=>{if($('list').scrollTop+$('list').clientHeight>=$('list').scrollHeight-120&&state.hasMore)load(false)});
$('newBtn').onclick=async()=>{state.current=await api('/api/prompts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:'未命名 Prompt',category:'pose',content_zh:'',content_en:'',content_ja:'',language_sync:'manual',scenarios:'',notes:'',tags:[]})});await load();renderEditor()};$('search').oninput=load;$('category').onchange=load;$('tag').oninput=load;
$('providerBtn').onclick=()=>openProviderSettings().catch(error=>alert(error.message));
load();renderEditor();
</script></body></html>
